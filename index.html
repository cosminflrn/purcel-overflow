const inb = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;
const grid = v => Array.from({ length: ROWS }, () => Array(COLS).fill(v));
const LD = LEVELS.map((lv, li) => {
  const d = { li, pathT: grid(false), blocked: grid(false), progT: grid(false) };
  d.paths = lv.paths.map(p => p.map(([c, r]) => ({ x: c * TS + TS / 2, y: r * TS + TS / 2 + MY })));
  d.lens = d.paths.map(pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return s; });
  lv.paths.forEach(p => {
    for (let i = 0; i < p.length - 1; i++) {
      let [c, r] = p[i]; const [c2, r2] = p[i + 1], dc = Math.sign(c2 - c), dr = Math.sign(r2 - r);
      for (;;) { if (inb(c, r)) { d.pathT[r][c] = true; d.blocked[r][c] = true; } if (c === c2 && r === r2) break; c += dc; r += dr; }
    }
  });
  const e = lv.paths[0][lv.paths[0].length - 1];
  d.end = { c: e[0], r: e[1] }; d.prog = { c: e[0], r: e[1] - 1 };
  for (let r = e[1] - 1; r <= e[1] + 1; r++) for (let c = e[0]; c <= e[0] + 2; c++) if (inb(c, r)) { d.blocked[r][c] = true; d.progT[r][c] = true; }
  const dist = grid(99);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (let r2 = 0; r2 < ROWS; r2++) for (let c2 = 0; c2 < COLS; c2++)
    if (d.pathT[r2][c2] || d.progT[r2][c2]) dist[r][c] = Math.min(dist[r][c], Math.max(Math.abs(r - r2), Math.abs(c - c2)));
  const pools = { wood: ['dev', 'dev', 'plant', 'cooler', 'shelf', 'dev', 'plant', 'dev'], carpet: ['table', 'dev', 'plant', 'sofa', 'cooler', 'dev', 'shelf'],
    server: ['server', 'server', 'dev', 'server', 'plant', 'dev', 'server'], kitchen: ['fridge', 'table', 'plant', 'dev', 'cooler', 'sofa', 'dev'],
    marble: ['sofa', 'plant', 'shelf', 'statue', 'dev', 'plant', 'table'], neon: ['dev', 'dev', 'plant', 'server', 'dev', 'dev', 'sofa'] };
  const R = mulberry(77 + li * 31); d.decor = [];
  for (let k = 0, tries = 0; k < 10 && tries < 600; tries++) {
    const pool = pools[lv.theme], type = pool[Math.floor(R() * pool.length)];
    const w = ['dev', 'sofa', 'table', 'shelf'].includes(type) ? 2 : 1;
    const c = Math.floor(R() * (COLS - w + 1)), r = Math.floor(R() * (ROWS - 1)) + (type === 'dev' ? 1 : 0);
    let ok = true; for (let i = 0; i < w; i++) if (!inb(c + i, r) || d.blocked[r][c + i] || dist[r][c + i] < 2) ok = false;
    if (ok && type === 'dev' && (d.blocked[r - 1][c] || d.blocked[r - 1][c + 1])) ok = false;
    if (!ok) continue;
    for (let i = 0; i < w; i++) d.blocked[r][c + i] = true;
    d.decor.push({ type, c, r, w, seed: R(), v: Math.floor(R() * 6) }); k++;
  }
  d.entries = lv.paths.map(p => { const [c0, r0] = p[0], [c1, r1] = p[1]; return { c: c0 + Math.sign(c1 - c0), r: r0 + Math.sign(r1 - r0), dc: Math.sign(c1 - c0), dr: Math.sign(r1 - r0) }; });
  return d;
});

const hpMult = gw => 1 + 0.08 * (gw - 1) + 0.0016 * (gw - 1) * (gw - 1);
function makeWave(gw, nPaths, boss, seed, df) {
  const R = mulberry(seed), n = Math.round(7 + df * 1.25), out = [];
  const types = PORDER.filter(k => PIGS[k].unlock <= gw);
  const wts = types.map(k => k === 'normal' ? 3 : PIGS[k].unlock === gw ? 2 : 1), tot = wts.reduce((a, b) => a + b, 0);
  const gap = Math.max(0.26, 0.9 - 0.017 * df);
  const rollType = () => { let x = R() * tot; for (let i = 0; i < types.length; i++) { x -= wts[i]; if (x <= 0) return types[i]; } return 'normal'; };
  while (out.length < n) {
    const t = rollType(), path = Math.floor(R() * nPaths);
    if (R() < 0.22 && gw > 2) { const k = 3 + Math.floor(R() * 3); for (let i = 0; i < k && out.length < n; i++) out.push({ d: i ? 0.28 : gap * 1.6, type: t, path }); }
    else out.push({ d: out.length ? gap : 1, type: t, path });
  }
  if (boss) out.push({ d: 3, type: 'king', path: Math.floor(R() * nPaths) });
  return out;
}

const AU = { ctx: null, muted: store.get('po_muted', false), last: {} };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state !== 'running') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const A = new AC(); AU.ctx = A;
  const comp = A.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(A.destination);
  AU.master = A.createGain(); AU.master.gain.value = AU.muted ? 0 : 1.15; AU.master.connect(comp);
  AU.mg = A.createGain(); AU.mg.gain.value = 0.55; AU.mg.connect(AU.master);
  AU.sg = A.createGain(); AU.sg.gain.value = 1.0; AU.sg.connect(AU.master);
  const b = A.createBuffer(1, A.sampleRate, A.sampleRate), dd = b.getChannelData(0);
  for (let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1;
  AU.noise = b; AU.next = A.currentTime + 0.15; AU.step = 0; AU.songKey = null; setInterval(sched, 40);
}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function osc(type, f, t, dur, vol, dest, f2, filt) {
  const A = AU.ctx, o = A.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

function bestSpot(g, k) {
  const d = LD[g.li], R = TOWERS[k].range * TS; let best = null, bs = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!canPlace(g, c, r)) continue; const cx = c * TS + 25, cy = MY + r * TS + 25; let s = 0;
    if (k === 'duck') { for (const t of g.towers) if (t.type !== 'duck' && Math.hypot(t.c * TS + 25 - cx, MY + t.r * TS + 25 - cy) <= R + 1) s += t.lvl * 2; }
    else for (let r2 = 0; r2 < ROWS; r2++) for (let c2 = 0; c2 < COLS; c2++) if (d.pathT[r2][c2] && Math.hypot(c2 * TS + 25 - cx, MY + r2 * TS + 25 - cy) <= R) s += 1;
    s += Math.random() * 0.5; if (s > bs) { bs = s; best = [c, r]; }
  }
  return best;
}
function botBuild(g, strat) {

    const want = pref.filter(k => un.includes(k)), k = want[g.towers.length % want.length];
    const upg = g.towers.filter(t => t.lvl < 3).sort((a, b) => upCost(a) - upCost(b))[0];
    const doUp = () => { const c = upCost(upg); g.money -= c; upg.invest += c; upg.lvl++; };
    if (strat !== 'naive' && g.towers.length >= 6 && upg && Math.random() < 0.45 && g.money >= upCost(upg)) { doUp(); continue; }
    if (g.money < TOWERS[k].cost) { if (strat !== 'naive' && upg && g.money >= upCost(upg)) { doUp(); continue; } break; }

  }
}

}
