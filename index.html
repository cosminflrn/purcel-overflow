    out.unshift({ x: a.x - dx * TS * 4, y: a.y - dy * TS * 4, c: a.c - dx * 4, r: a.r - dy * 4, tp: false });
    for (let i = 1; i < out.length; i++) if (out[i].tp) d.lifts.push([out[i - 1].c, out[i - 1].r], [out[i].c, out[i].r]);

  });

  for (let r = d.prog.r; r < d.prog.r + 3; r++) for (let c = d.prog.c; c < d.prog.c + 3; c++) if (inb(c, r)) { d.blocked[r][c] = true; d.progT[r][c] = true; }

    if (d.pathT[r2][c2] || d.progT[r2][c2]) dist[r][c] = Math.min(dist[r][c], Math.max(Math.abs(r - r2), Math.abs(c - c2)));
  const pools = { wood: ['dev', 'dev', 'plant', 'cooler', 'shelf', 'dev', 'plant', 'dev'], carpet: ['dev', 'plant', 'sofa', 'plant', 'cooler', 'dev', 'shelf'],
    server: ['server', 'dev', 'server', 'plant', 'dev', 'server'], kitchen: ['fridge', 'table', 'plant', 'dev', 'cooler', 'fridge', 'dev'],

  const R = mulberry(77 + li * 31); let firstDev = true;
  for (let k = 0, tries = 0; k < 9 && tries < 800; tries++) {
    const pool = pools[lv.theme], type = pool[Math.floor(R() * pool.length)];
    const w = ['dev', 'sofa', 'table', 'shelf'].includes(type) ? 2 : 1;
    const c = Math.floor(R() * (COLS - w + 1)), r = 1 + Math.floor(R() * (ROWS - 1));

// =================================================================== SIMULARE (pentru balansare)
function bestSpot(g, k) {
  const d = LD[g.li], R = TOWERS[k].range * TS; let best = null, bs = -1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!canPlace(g, c, r)) continue; const cx = c * TS + 25, cy = MY + r * TS + 25; let s = 0;
    if (k === 'coffee') { for (const t of g.towers) if (t.type !== 'coffee' && Math.hypot(t.c * TS + 25 - cx, MY + t.r * TS + 25 - cy) <= R + 1) s += t.lvl * 2; }
    else for (let r2 = 0; r2 < ROWS; r2++) for (let c2 = 0; c2 < COLS; c2++) if (d.pathT[r2][c2] && Math.hypot(c2 * TS + 25 - cx, MY + r2 * TS + 25 - cy) <= R) s += 1;
    s += Math.random() * 0.5; if (s > bs) { bs = s; best = [c, r]; }
  }
  return best;
}
function botBuild(g, strat) {
  for (let loops = 0; loops < 40; loops++) {
    const un = TORDER.filter(k => unlocked(g, k));
    const pref = strat === 'naive' ? ['stapler'] : ['stapler', 'stapler', 'ac', 'printer', 'soda', 'firewall', 'coffee', 'slicer', 'balloon', 'stapler', 'printer', 'firewall', 'slicer'];
    const want = pref.filter(k => un.includes(k)), k = want[g.towers.length % want.length];
    const upg = g.towers.filter(t => t.lvl < 3).sort((a, b) => upCost(a) - upCost(b))[0];
    const doUp = () => { const c = upCost(upg); g.money -= c; upg.invest += c; upg.lvl++; };
    if (strat !== 'naive' && g.towers.length >= 6 && upg && Math.random() < 0.45 && g.money >= upCost(upg)) { doUp(); continue; }
    if (g.money < TOWERS[k].cost) { if (strat !== 'naive' && upg && g.money >= upCost(upg)) { doUp(); continue; } break; }
    const spot = bestSpot(g, k); if (!spot) break; placeTower(g, k, spot[0], spot[1]);
  }
}
function simulate(li, skill = 0.85, strat = 'smart') {
  const g = newGame(li, { sim: true }); const dt = 1 / 30; let guard = 0;
  while (!g.result && guard++ < 400000) {

}
