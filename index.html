const inb = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;
const grid = v => Array.from({ length: ROWS }, () => Array(COLS).fill(v));
const LD = LEVELS.map((lv, li) => {
  const d = { li, pathT: grid(false), blocked: grid(false), progT: grid(false) };
  d.paths = lv.paths.map(p => p.map(([c, r]) => ({ x: c * TS + TS / 2, y: r * TS + TS / 2 + MY })));
  d.lens = d.paths.map(pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return s; });
  lv.paths.forEach(p => {
    for (let i = 0; i < p.length - 1; i++) {
      let [c, r] = p[i]; const [c2, r2] = p[i + 1]; const dc = Math.sign(c2 - c), dr = Math.sign(r2 - r);
      for (;;) { if (inb(c, r)) { d.pathT[r][c] = true; d.blocked[r][c] = true; } if (c === c2 && r === r2) break; c += dc; r += dr; }
    }
  });
  const e = lv.paths[0][lv.paths[0].length - 1];
  d.end = { c: e[0], r: e[1] }; d.prog = { c: e[0], r: e[1] - 1 };
  for (let r = e[1] - 1; r <= e[1] + 1; r++) for (let c = e[0]; c <= e[0] + 2; c++) if (inb(c, r)) { d.blocked[r][c] = true; d.progT[r][c] = true; }
  // distanța față de traseu
  const dist = grid(99);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (let r2 = 0; r2 < ROWS; r2++) for (let c2 = 0; c2 < COLS; c2++)
    if (d.pathT[r2][c2] || d.progT[r2][c2]) dist[r][c] = Math.min(dist[r][c], Math.max(Math.abs(r - r2), Math.abs(c - c2)));
  const pools = { wood: ['desk', 'desk', 'plant', 'cooler', 'shelf', 'desk', 'plant'], carpet: ['table', 'plant', 'sofa', 'plant', 'cooler', 'shelf'],
    server: ['server', 'server', 'server', 'plant', 'cooler', 'server'], kitchen: ['fridge', 'table', 'plant', 'cooler', 'sofa', 'fridge'],
    marble: ['sofa', 'plant', 'shelf', 'table', 'plant', 'statue'] };
  const R = mulberry(77 + li * 31); d.decor = [];
  for (let k = 0, tries = 0; k < 9 && tries < 400; tries++) {
    const type = pools[lv.theme][Math.floor(R() * pools[lv.theme].length)];
    const w = ['desk', 'sofa', 'table', 'shelf'].includes(type) ? 2 : 1;
    const c = Math.floor(R() * (COLS - w + 1)), r = Math.floor(R() * ROWS);
    let ok = true; for (let i = 0; i < w; i++) if (!inb(c + i, r) || d.blocked[r][c + i] || dist[r][c + i] < 2) ok = false;
    if (!ok) continue;
    for (let i = 0; i < w; i++) d.blocked[r][c + i] = true;
    d.decor.push({ type, c, r, w, seed: R() }); k++;
  }
  d.entries = lv.paths.map(p => {
    const [c0, r0] = p[0], [c1, r1] = p[1];
    return { c: c0 + Math.sign(c1 - c0), r: r0 + Math.sign(r1 - r0), dc: Math.sign(c1 - c0), dr: Math.sign(r1 - r0) };
  });
  return d;
});

function makeWave(li, w, nPaths, last) {
  const R = mulberry(1000 + li * 53 + w * 7), n = Math.round(8 + w * 2.6 + li * 4), out = [];
  const gap = Math.max(0.3, 0.95 - 0.07 * li - 0.045 * w);
  for (let i = 0; i < n; i++) {
    const x = R(); let t = 'normal';
    if (w >= 1 && x < 0.24) t = 'fast';
    else if ((li >= 1 || w >= 3) && x > 0.84) t = 'big';
    else if (li >= 1 && x > 0.58 && x <= 0.70) t = 'hacker';
    else if (li >= 2 && x > 0.70 && x <= 0.84) t = 'armor';
    out.push({ d: i === 0 ? 1 : gap * (R() < 0.22 ? 0.35 : 1), type: t, path: Math.floor(R() * nPaths) });
  }
  if (last && li >= 2) { out.push({ d: 2.5, type: 'boss', path: 0 }); if (li === 4) out.push({ d: 4, type: 'boss', path: 2 % nPaths }); }
  return out;
}

const AU = { ctx: null, music: store.get('po_music', true), sfx: store.get('po_sfx', true), last: {} };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state !== 'running') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const A = new AC(); AU.ctx = A;

  AU.sg = A.createGain(); AU.sg.gain.value = AU.sfx ? 0.55 : 0; AU.sg.connect(AU.master);
  const b = A.createBuffer(1, A.sampleRate, A.sampleRate), dd = b.getChannelData(0);
  for (let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1;
  AU.noise = b; AU.next = A.currentTime + 0.15; AU.step = 0; setInterval(sched, 50);
}
function env(g, t, a, peak, dur) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
function osc(type, f, t, dur, vol, dest, f2, filt) {
  const A = AU.ctx, o = A.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = A.createGain(); env(g, t, Math.min(0.02, dur / 4), vol, dur); let n = o;
  if (filt) { const fl = A.createBiquadFilter(); fl.type = filt[0]; fl.frequency.value = filt[1]; fl.Q.value = filt[2] || 1; o.connect(fl); n = fl; }
  n.connect(g); g.connect(dest || AU.sg); o.start(t); o.stop(t + dur + 0.05);
}
function nz(t, dur, vol, ft, freq, dest, q) {
  const A = AU.ctx, s = A.createBufferSource(); s.buffer = AU.noise;
  const f = A.createBiquadFilter(); f.type = ft; f.frequency.value = freq; f.Q.value = q || 1;
  const g = A.createGain(); env(g, t, 0.003, vol, dur); s.connect(f); f.connect(g); g.connect(dest || AU.sg);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const SFX = {

  hit: t => { osc('sine', 120, t, 0.25, 0.5, null, 40); nz(t, 0.15, 0.3, 'lowpass', 400); osc('square', 220, t + 0.02, 0.18, 0.05, null, 140); },
  ding: t => { osc('sine', 1047, t, 0.5, 0.14); osc('sine', 1568, t + 0.09, 0.6, 0.1); },
  good: t => { [523, 659, 784, 1047, 1319].forEach((f, i) => osc('triangle', f, t + i * 0.07, 0.22, 0.13)); },
  bad: t => { osc('sawtooth', 110, t, 0.7, 0.25, null, 50, ['lowpass', 800]); nz(t, 0.7, 0.55, 'lowpass', 500); osc('square', 90, t + 0.1, 0.4, 0.08); },
  sad: t => { osc('triangle', 392, t, 0.25, 0.12, null, 370); osc('triangle', 349, t + 0.25, 0.25, 0.12, null, 330); osc('triangle', 294, t + 0.5, 0.6, 0.12, null, 262); },
  win: t => { [523, 659, 784, 659, 784, 1047].forEach((f, i) => osc('square', f, t + i * 0.12, 0.2, 0.06, null, null, ['lowpass', 3000])); },
  lose: t => { [392, 370, 349, 330].forEach((f, i) => osc('triangle', f, t + i * 0.25, 0.3, 0.15)); osc('sine', 110, t + 1, 0.8, 0.2, null, 60); },
  boss: t => { osc('sawtooth', 80, t, 1.2, 0.25, null, 55, ['lowpass', 400]); osc('sawtooth', 300, t + 0.1, 0.7, 0.12, null, 150, ['bandpass', 700, 2]); },

function sfx(name, gap = 0.04) {
  if (!AU.ctx || !AU.sfx) return; const now = AU.ctx.currentTime;
  if (AU.last[name] && now - AU.last[name] < gap) return; AU.last[name] = now; SFX[name](now);
}
const gsfx = (g, n, gap) => { if (!g.demo) sfx(n, gap); };
// muzică lo-fi
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = [[50, 53, 57, 60, 64], [43, 50, 53, 57, 59], [48, 52, 55, 59, 62], [45, 52, 55, 60, 64]];
const MEL = [[69, 0, 72, 0, 74, 72, 0, 69], [67, 0, 0, 71, 0, 74, 72, 0], [72, 0, 76, 74, 0, 72, 71, 0], [69, 0, 67, 0, 64, 0, 0, 0]];
function pad(f, t, dur) {
  const A = AU.ctx, o = A.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = (Math.random() - 0.5) * 14;
  const fl = A.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 900; const g = A.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.033, t + 0.5); g.gain.linearRampToValueAtTime(0.022, t + dur * 0.7); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  o.connect(fl); fl.connect(g); g.connect(AU.mg); o.start(t); o.stop(t + dur + 0.05);
}
function sched() {
  const A = AU.ctx; if (!A || A.state !== 'running') return;
  const spb = 60 / 84 / 2;
  if (AU.next < A.currentTime) AU.next = A.currentTime + 0.05;
  while (AU.next < A.currentTime + 0.3) {
    const s = AU.step, bar = Math.floor(s / 8) % 4, i = s % 8, t = AU.next + (i % 2 ? spb * 0.14 : 0), mg = AU.mg;
    const intense = scr === 'play' && G && G.state === 'wave';
    if (i === 0) CH[bar].forEach(m => pad(mtof(m), t, spb * 8));
    if (i === 0 || i === 5) osc('sine', mtof(CH[bar][0] - 12), t, spb * 1.8, 0.2, mg);
    if (i === 0 || i === 4 || (intense && i === 7)) osc('sine', 120, t, 0.14, 0.33, mg, 45);
    if (i === 2 || i === 6) nz(t, 0.12, 0.07, 'bandpass', 1800, mg, 0.7);
    nz(t, 0.03, intense ? 0.05 : 0.03, 'highpass', 7000, mg);
    const ph = Math.floor(s / 32);
    const m = MEL[ph % 2 ? bar : (bar + 2) % 4][i];
    if (m && ph % 3 !== 2) osc('triangle', mtof(m), t, spb * 1.6, 0.055, mg, null, ['lowpass', 2200]);

}
function toggleMusic() { AU.music = !AU.music; store.set('po_music', AU.music); if (AU.ctx) AU.mg.gain.setTargetAtTime(AU.music ? 0.3 : 0, AU.ctx.currentTime, 0.1); }

function boom(x, y) { for (let i = 0; i < 26; i++) { const a = Math.random() * 7, s = 60 + Math.random() * 180; FX.push({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 0.6, m: 0.6, c: pick(['#ffdd55', '#ff8a2a', '#ff4d2a']), s: 3 + Math.random() * 3 }); } smoke(x, y, 18); }
function paperBits(x, y) { for (let i = 0; i < 10; i++) { const a = Math.random() * 7, s = 40 + Math.random() * 80; FX.push({ k: 'conf', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, l: 0.7, m: 0.7, c: '#f4f4f0', s: 4, r: Math.random() * 7, vr: 8 }); } }
function updateFx(dt) {
  if (shakeT > 0) shakeT -= dt; if (flashT > 0) flashT -= dt;
  for (const p of FX) {
    p.l -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'conf') { p.vy += 420 * dt; p.vx *= 0.99; p.r += p.vr * dt; }
    else if (p.k === 'puff' || p.k === 'spark') { p.vx *= 0.9; p.vy *= 0.9; }

  }

}

    ctx.globalAlpha = p.k === 'text' ? Math.min(1, a * 2) : a;
    if (p.k === 'text') textS(p.t, p.x, p.y, p.s, p.c, 'center', FH, '700');

    else { ell(p.x, p.y, p.s * (p.k === 'puff' ? 1.5 - a * 0.5 : 1), p.s * (p.k === 'puff' ? 1.5 - a * 0.5 : 1)); ctx.fillStyle = p.c; ctx.fill(); }

  return { li, demo, money: LEVELS[li].money, hp: 20, tokens: 100000, wave: 0, state: 'build', pigs: [], towers: [], projs: [],
    queue: [], qT: 0, waveTotal: 0, req: null, nextReq: 4, canim: null, face: { type: 'normal', t: 0 }, msg: '', msgT: 0, idc: 1,
    speed: 1, lastReq: [-1, -1], demoT: 1.5, snap: null, time: 0 };
}
function say(g, s, t = 4) { g.msg = s; g.msgT = t; }
function towerAt(g, c, r) { return g.towers.find(t => t.c === c && t.r === r); }
function canPlace(g, type, c, r) {
  if (!inb(c, r) || towerAt(g, c, r)) return false;
  const d = LD[g.li];
  if (TOWERS[type].onPath) return d.pathT[r][c] && !d.progT[r][c];
  return !d.blocked[r][c];
}
function placeTower(g, type, c, r) {
  const T = TOWERS[type];
  g.money -= T.cost; g.towers.push({ id: g.idc++, type, c, r, lvl: 1, invest: T.cost, cd: 0, ang: -Math.PI / 2, fx: 0 });
  gsfx(g, 'place'); puff(c * TS + 25, MY + r * TS + 25, 'rgba(255,255,255,.7)', 8);
}
function startWave(g) {
  if (g.state !== 'build') return;
  const lv = LEVELS[g.li];
  if (!g.demo) g.snap = JSON.stringify({ ...g, snap: null });
  g.queue = makeWave(g.li, g.demo ? g.wave % 4 : g.wave, lv.paths.length, !g.demo && g.wave === lv.waves - 1);
  g.qT = g.queue.length ? g.queue[0].d : 0; g.waveTotal = g.queue.length; g.state = 'wave'; g.nextReq = 4; g.req = null;
  gsfx(g, 'wave'); if (!g.demo) say(g, `Valul ${g.wave + 1} a pornit! Nu-i lăsa să ajungă la programator.`);
}
function spawnPig(g, type, pi) {
  const d = PIGS[type], P = LD[g.li].paths[pi][0], mult = g.demo ? 1 + 0.1 * (g.wave % 4) : 1 + 0.13 * g.wave + 0.3 * g.li;
  g.pigs.push({ type, path: pi, seg: 0, x: P.x, y: P.y, dist: 0, hp: d.hp * mult, max: d.hp * mult, spd: d.spd * (0.92 + Math.random() * 0.16),
    slow: 1, face: 1, anim: Math.random() * 6, flash: 0, ox: (Math.random() - 0.5) * 12, oy: (Math.random() - 0.5) * 8, id: g.idc++, dead: false });
}
function damage(g, p, amt) {
  if (p.dead) return; p.hp -= amt; p.flash = 0.08;
  if (p.hp <= 0) {
    p.dead = true; const d = PIGS[p.type]; g.money += d.reward;
    puff(p.x, p.y, '#ffc3d1', 10); floatText(p.x, p.y - 22, `+${d.reward} lei`, '#ffd84d', 15);
    gsfx(g, Math.random() < 0.5 ? 'oink' : 'squeal', 0.08);
    if (p.type === 'boss') { confetti(p.x, p.y, 40); shakeT = 0.4; }
  }
}
function pigRemain(g, p) { return LD[g.li].lens[p.path] - p.dist; }
function firstInRange(g, cx, cy, R) {
  let best = null, bd = 1e9;
  for (const p of g.pigs) { if (p.dead) continue; const dx = p.x - cx, dy = p.y - cy; if (dx * dx + dy * dy > R * R) continue; const rem = pigRemain(g, p); if (rem < bd) { bd = rem; best = p; } }
  return best;
}
function newReq(g) {
  const bad = Math.random() < 0.3 + 0.05 * g.li, arr = bad ? BAD : GOOD; let i;
  do { i = Math.floor(Math.random() * arr.length); } while (i === g.lastReq[bad ? 1 : 0]);
  g.lastReq[bad ? 1 : 0] = i; g.req = { bad, i, t: 0, max: Math.max(5, 10 - 0.8 * g.li) }; gsfx(g, 'ding');
}
function claudeAnim(g, type, line, sub) {
  g.canim = { type, t: 0, line, sub };
  const d = LD[g.li], lx = (d.prog.c + 1.5) * TS, ly = MY + (d.prog.r + 1.6) * TS;
  if (type === 'good') { sfx('good'); confetti(PX + 140, 470, 45); g.face = { type: 'happy', t: 2.2 }; }
  else if (type === 'bad') { sfx('bad'); shakeT = 0.6; flashT = 0.6; flashCol = '255,50,40'; boom(lx, ly); g.face = { type: 'shock', t: 2.8 }; }
  else { sfx('sad'); g.face = { type: 'meh', t: 1.8 }; }
}
function answer(g, ok) {
  const q = g.req; if (!q) return; g.req = null; g.nextReq = Math.max(2.5, 4 + Math.random() * 5 - 0.5 * g.li);
  if (ok && !q.bad) { g.money += 20; g.tokens -= 1500; claudeAnim(g, 'good', GOOD[q.i][1], '+20 lei · −1,5k tokeni'); }
  else if (ok && q.bad) { g.hp -= 3; g.tokens -= 10000; claudeAnim(g, 'bad', BAD[q.i][1], '−3 nervi · −10k tokeni'); }
  else if (!ok && q.bad) { g.money += 15; claudeAnim(g, 'good', pick(DENY_BAD), 'Bine prins! +15 lei'); }
  else { g.tokens -= 4000; claudeAnim(g, 'sad', pick(DENY_GOOD), 'Era o comandă bună · −4k tokeni'); }
}
function lose(reason) { loseReason = reason; scr = 'lose'; sfx('lose'); selShop = null; selTower = null; }
function levelWin() {
  const li = G.li; progress.done[li] = true; progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, li + 2));
  store.set('po_done', progress.done); store.set('po_unlocked', progress.unlocked);
  sfx('win'); confetti(500, 360, 90); selShop = null; selTower = null;
  scr = li === LEVELS.length - 1 ? 'final' : 'win';
}

function updateGame(g, dt) {
  g.time += dt; if (g.msgT > 0) g.msgT -= dt; if (g.face.t > 0) g.face.t -= dt; else g.face.type = 'normal';
  if (g.canim) { g.canim.t += dt; if (g.canim.t > 4) g.canim = null; }
  if (g.demo) { g.hp = 20; if (g.state === 'build') { g.demoT -= dt; if (g.demoT <= 0) { startWave(g); g.demoT = 2; } } }
  if (g.state !== 'wave') { for (const t of g.towers) if (t.fx > 0) t.fx -= dt; return; }
  const d = LD[g.li];
  // spawn
  if (g.queue.length) {
    g.qT -= dt;
    while (g.queue.length && g.qT <= 0) {
      const q = g.queue.shift(); spawnPig(g, q.type, q.path);
      if (q.type === 'boss') { gsfx(g, 'boss'); say(g, 'A sosit PORCUL ȘEF! Pregătește tot ce ai.'); }
      if (g.queue.length) g.qT += g.queue[0].d;
    }
  }
  // Claude
  if (!g.demo) {
    if (!g.req) { g.nextReq -= dt; if (g.nextReq <= 0) newReq(g); }
    else {
      g.req.t += dt; g.tokens -= (350 + 120 * g.li) * dt;
      if (g.req.t >= g.req.max) { g.req = null; g.tokens -= 6000; g.nextReq = 4; claudeAnim(g, 'sad', 'Am așteptat, am așteptat... și am reîncercat singur.', 'Prea încet · −6k tokeni'); }
    }
  }
  // cafea -> încetinire
  for (const p of g.pigs) p.slow = 1;
  for (const t of g.towers) if (t.type === 'coffee') {
    const cx = t.c * TS + 25, cy = MY + t.r * TS + 25, m = 0.5 - 0.1 * (t.lvl - 1);
    for (const p of g.pigs) if (Math.abs(p.x - cx) < 27 && Math.abs(p.y - cy) < 27) p.slow = Math.min(p.slow, m);
  }
  // porci
  for (const p of g.pigs) {
    if (p.dead) continue;
    p.anim += dt * 11 * p.slow; if (p.flash > 0) p.flash -= dt;
    const pts = d.paths[p.path]; let mv = p.spd * p.slow * dt;
    while (mv > 0 && p.seg < pts.length - 1) {
      const a = pts[p.seg + 1], dx = a.x - p.x, dy = a.y - p.y, dd = Math.hypot(dx, dy);
      if (Math.abs(dx) > 0.1) p.face = dx < 0 ? -1 : 1;
      if (dd <= mv) { p.x = a.x; p.y = a.y; p.seg++; mv -= dd; p.dist += dd; } else { p.x += dx / dd * mv; p.y += dy / dd * mv; p.dist += mv; mv = 0; }
    }
    if (p.seg >= pts.length - 1) {
      p.dead = true; const pd = PIGS[p.type]; puff(p.x + 20, p.y, '#ffc3d1', 8); g.face = { type: 'hurt', t: 0.8 };
      if (!g.demo) {
        g.hp -= pd.dmg; shakeT = Math.max(shakeT, 0.25); flashT = 0.25; flashCol = '255,60,60'; gsfx(g, 'hit', 0.1);
        floatText(p.x + 40, p.y - 50, `−${pd.dmg} nervi`, '#ff6b6b', 18);
        if (pd.tokens) { g.tokens -= pd.tokens; floatText(p.x + 40, p.y - 72, 'Porcul hacker a furat tokeni!', '#d97757', 15); }
      }
    }
  }
  // turnuri
  for (const t of g.towers) {
    const T = TOWERS[t.type], cx = t.c * TS + 25, cy = MY + t.r * TS + 25, lm = 1 + 0.6 * (t.lvl - 1);
    if (t.cd > 0) t.cd -= dt; if (t.fx > 0) t.fx -= dt;
    if (t.type === 'staple' || t.type === 'printer') {
      const R = (T.range + 0.35 * (t.lvl - 1)) * TS;
      if (t.cd <= 0) {
        const p = firstInRange(g, cx, cy, R);
        if (p) {
          t.ang = Math.atan2(p.y - cy, p.x - cx); t.cd = T.rate * (1 - 0.12 * (t.lvl - 1)); t.fx = 0.12;
          if (t.type === 'staple') {
            g.projs.push({ k: 'staple', x: cx, y: cy, tg: p, dmg: T.dmg * lm }); gsfx(g, 'staple', 0.05);
            if (t.lvl >= 3) { const p2 = g.pigs.find(q => !q.dead && q !== p && Math.hypot(q.x - cx, q.y - cy) < R) || p; g.projs.push({ k: 'staple', x: cx, y: cy, tg: p2, dmg: T.dmg * lm }); }
          } else {
            const lead = 0.45 * p.spd * p.slow, pts = d.paths[p.path], nx = pts[Math.min(p.seg + 1, pts.length - 1)];
            const dx = nx.x - p.x, dy = nx.y - p.y, dl = Math.hypot(dx, dy) || 1, tx = p.x + dx / dl * Math.min(lead, dl), ty = p.y + dy / dl * Math.min(lead, dl);
            g.projs.push({ k: 'paper', sx: cx, sy: cy - 10, tx, ty, t: 0, dur: 0.45, dmg: T.dmg * lm, sp: (T.splash + 0.15 * (t.lvl - 1)) * TS }); gsfx(g, 'paper', 0.1);
          }
        }
      }
    } else if (t.type === 'trap') {
      if (t.cd <= 0) {
        const hits = g.pigs.filter(p => !p.dead && Math.abs(p.x - cx) < 22 && Math.abs(p.y - cy) < 22);
        if (hits.length) { (t.lvl >= 3 ? hits : [hits[0]]).forEach(p => damage(g, p, T.dmg * lm)); t.cd = T.rate * (1 - 0.15 * (t.lvl - 1)); t.fx = 0.35; gsfx(g, 'snap', 0.06); }
      }
    } else if (t.type === 'firewall') {
      const R = (T.range + 0.25 * (t.lvl - 1)) * TS; let any = false;
      for (const p of g.pigs) if (!p.dead && Math.hypot(p.x - cx, p.y - cy) < R) { damage(g, p, T.dps * lm * dt); any = true; }
      if (any) { t.fx = 0.25; gsfx(g, 'fire', 0.28); }
    }
  }
  // proiectile
  for (const pr of g.projs) {
    if (pr.k === 'staple') {
      const p = pr.tg; if (p.dead) { pr.done = true; continue; }
      const dx = p.x - pr.x, dy = p.y - pr.y, dd = Math.hypot(dx, dy), st = 700 * dt; pr.a = Math.atan2(dy, dx);
      if (dd < st + 6) { damage(g, p, pr.dmg * (PIGS[p.type].armor || 1)); pr.done = true; if (PIGS[p.type].armor) FX.push({ k: 'spark', x: p.x, y: p.y - 6, vx: 0, vy: -40, l: 0.2, m: 0.2, c: '#fff6a0', s: 3 }); }
      else { pr.x += dx / dd * st; pr.y += dy / dd * st; }
    } else {
      pr.t += dt;
      if (pr.t >= pr.dur) {
        pr.done = true; paperBits(pr.tx, pr.ty); gsfx(g, 'thud', 0.08);
        for (const p of g.pigs) if (!p.dead && Math.hypot(p.x - pr.tx, p.y - pr.ty) < pr.sp) damage(g, p, pr.dmg);
      }
    }
  }
  g.projs = g.projs.filter(p => !p.done);
  g.pigs = g.pigs.filter(p => !p.dead);
  if (!g.demo) {
    if (g.hp <= 0) { g.hp = 0; lose('Programatorul a cedat nervos. Porcii au câștigat.'); return; }
    if (g.tokens <= 0) { g.tokens = 0; lose('S-au terminat tokenii! Claude a rămas fără suflu.'); return; }
  }
  if (!g.queue.length && !g.pigs.length) {
    g.wave++; g.req = null; g.state = 'build'; g.projs = [];
    if (g.demo) { g.demoT = 2; return; }
    const lv = LEVELS[g.li], inc = 60 + 15 * g.li + Math.min(30, Math.floor(g.money / 25));
    g.money += inc;
    if (g.wave >= lv.waves) { levelWin(); return; }
    say(g, `Val terminat! Salariu: +${inc} lei. Mai pune capcane și pornește valul următor.`, 6);
    floatText(500, MY + 300, `Salariu +${inc} lei`, '#ffd84d', 34); sfx('coin');
  }
}

function drawPig(p, x, y, sc = 1) {
  const d = PIGS[p.type], s = d.size * sc, f = p.face, t = p.type;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ell(0, 14 * s, 17 * s, 5 * s); ctx.fill();
  ctx.scale(f * s, s);
  const leg = Math.sin(p.anim) * 3, base = t === 'big' ? ['#ffc6d2', '#e8809d'] : t === 'boss' ? ['#ffcad6', '#e07093'] : ['#ffd5df', '#f08aa6'];
  const dark = '#d4708e';
  ctx.fillStyle = dark; rr(-12, 3 - leg, 6, 11, 2); ctx.fill(); rr(5, 3 + leg, 6, 11, 2); ctx.fill();
  // coadă
  ctx.strokeStyle = dark; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(-19, -4, 4, 0.2, Math.PI * 1.7); ctx.stroke();
  // corp
  ctx.fillStyle = rg(-4, -6, 2, 22, [base[0], base[1]]); ell(0, 0, 18, 12.5); ctx.fill();
  ctx.strokeStyle = 'rgba(180,80,110,.5)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ell(-3, -7, 9, 3); ctx.fill();
  ctx.fillStyle = shade('#d4708e', -8); rr(-6, 3 + leg * 0.7, 6, 11, 2); ctx.fill(); rr(10, 3 - leg * 0.7, 6, 11, 2); ctx.fill();
  ctx.fillStyle = '#7a3a4c'; ctx.fillRect(-6, 12 + leg * 0.7, 6, 2); ctx.fillRect(10, 12 - leg * 0.7, 6, 2);
  if (t === 'hacker') { ctx.fillStyle = lg(0, -12, 0, 12, ['#3a3f4b', '#23262e']); ell(0, -1, 17, 11.5); ctx.fill(); }
  // cap
  const hx = 14, hy = -5;
  ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(hx - 9, hy - 6); ctx.lineTo(hx - 6, hy - 16); ctx.lineTo(hx - 1, hy - 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx + 1, hy - 7); ctx.lineTo(hx + 6, hy - 16); ctx.lineTo(hx + 9, hy - 5); ctx.fill();
  ctx.fillStyle = rg(hx - 3, hy - 4, 1, 12, [base[0], base[1]]); ell(hx, hy, 10.5, 9.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,110,140,.35)'; ell(hx + 1, hy + 4, 3.5, 2.2); ctx.fill();
  ctx.fillStyle = lg(0, hy - 4, 0, hy + 6, ['#ffa3bb', '#e7789a']); ell(hx + 9, hy + 1.5, 5, 4.3); ctx.fill();
  ctx.fillStyle = '#9b3c5c'; ell(hx + 7.6, hy + 1.5, 1.1, 1.6); ctx.fill(); ell(hx + 10.6, hy + 1.5, 1.1, 1.6); ctx.fill();
  ctx.fillStyle = '#1a1014'; ell(hx + 2.5, hy - 3, 1.9, 2.2); ctx.fill(); ctx.fillStyle = '#fff'; ell(hx + 3, hy - 3.8, 0.7, 0.7); ctx.fill();
  if (t === 'fast') { ctx.fillStyle = '#ff4d6d'; ctx.fillRect(hx - 9, hy - 7, 19, 3); ctx.fillRect(hx - 13, hy - 7, 4, 2); ctx.fillRect(hx - 14, hy - 4, 4, 2); }
  if (t === 'hacker') { ctx.fillStyle = '#2b2f38'; ctx.beginPath(); ctx.arc(hx - 1, hy - 1, 12, Math.PI * 0.6, Math.PI * 1.65); ctx.lineTo(hx + 6, hy - 11); ctx.fill(); ctx.fillStyle = '#0c0c0f'; rr(hx - 1, hy - 5, 9, 3.5, 1.5); ctx.fill(); ctx.fillStyle = '#39ff88'; ctx.font = 'bold 6px monospace'; ctx.fillText('01', -8, 2); }
  if (t === 'armor') { ctx.fillStyle = rg(hx - 3, hy - 9, 1, 13, ['#ff7f6e', '#c0392b']); ctx.beginPath(); ctx.arc(hx, hy - 1, 11, Math.PI * 1.02, Math.PI * 1.98); ctx.fill(); ctx.fillStyle = 'rgba(40,40,50,.8)'; ctx.fillRect(hx - 1, hy - 6, 11, 4); ctx.fillStyle = '#fff'; ctx.fillRect(hx - 6, hy - 10, 2, 5); }
  if (t === 'big') { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.moveTo(hx + 6, hy + 5); ctx.lineTo(hx + 8, hy + 10); ctx.lineTo(hx + 9, hy + 5); ctx.fill(); }
  if (t === 'boss') {

    ctx.moveTo(hx - 8, hy - 8); ctx.lineTo(hx - 8, hy - 17); ctx.lineTo(hx - 4, hy - 12); ctx.lineTo(hx, hy - 19); ctx.lineTo(hx + 4, hy - 12); ctx.lineTo(hx + 8, hy - 17); ctx.lineTo(hx + 8, hy - 8); ctx.fill();
    ctx.fillStyle = '#e8434b'; ell(hx, hy - 12, 1.6, 1.6); ctx.fill();

    ctx.strokeStyle = '#f2c94c'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(hx - 2, hy + 4, 7, 0.3, Math.PI * 0.9); ctx.stroke();

  }
}

function drawTower(type, cx, cy, lvl, ang, fx, time) {
  ctx.save(); ctx.translate(cx, cy);
  if (type === 'staple') {
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ell(2, 4, 18, 16); ctx.fill();
    ctx.fillStyle = rg(-5, -5, 2, 19, ['#9aa3b2', '#4b5262']); ell(0, 0, 17, 17); ctx.fill();
    ctx.strokeStyle = '#2d323c'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.rotate(ang);
    const kick = fx > 0 ? -3 : 0;
    ctx.fillStyle = '#1f2229'; rr(-10 + kick, -7, 30, 14, 4); ctx.fill();
    ctx.fillStyle = lg(0, -6, 0, 6, ['#e85a4f', '#a8231b']); rr(-9 + kick, -6, 27, 8, 4); ctx.fill();
    ctx.fillStyle = '#d7dbe2'; ctx.fillRect(16 + kick, -2, 4, 4);
    if (fx > 0) { ctx.fillStyle = 'rgba(255,240,150,.8)'; ell(24, 0, 4, 3); ctx.fill(); }
  } else if (type === 'printer') {
    ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(-17, -9, 38, 30, 5); ctx.fill();
    ctx.fillStyle = lg(0, -14, 0, 16, ['#f4f1ea', '#c9c3b6']); rr(-19, -13, 38, 28, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#3c3f47'; rr(-15, -9, 30, 7, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-11, -17 + (fx > 0 ? -3 : 0), 22, 9);
    ctx.fillStyle = '#c9ccd2'; ctx.fillRect(-8, -14 + (fx > 0 ? -3 : 0), 14, 1); ctx.fillRect(-8, -11 + (fx > 0 ? -3 : 0), 10, 1);
    ctx.fillStyle = '#2b2e35'; ctx.fillRect(-14, 5, 28, 3);
    ctx.fillStyle = (Math.floor(time * 3) % 2) ? '#3df07a' : '#1b8a44'; ell(13, 0, 2, 2); ctx.fill();
  } else if (type === 'firewall') {
    const glow = fx > 0 ? 1 : 0.35;
    ctx.fillStyle = `rgba(255,120,40,${0.18 * glow})`; ell(0, 0, 30, 30); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(-18, 4, 40, 18, 3); ctx.fill();
    for (let i = 0; i < 3; i++) {
      const fl = (10 + 6 * Math.sin(time * 13 + i * 2.1)) * (0.6 + 0.4 * glow);
      ctx.fillStyle = lg(0, 2, 0, 2 - fl - 6, ['#ff5a1f', '#ffb52e', 'rgba(255,240,120,.8)']);

// ---------------------------------------------------------------- bucla principală
DG = demoSetup();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (scr === 'menu' || scr === 'levels') { updateGame(DG, dt); updateFx(dt); }
  else if (scr === 'play') { if (!paused) for (let i = 0; i < G.speed && scr === 'play'; i++) updateGame(G, dt); updateFx(paused ? 0 : dt * G.speed); }
  else updateFx(dt);
